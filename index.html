<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>212. Angriffsbataillon | EGM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0d12;
            --bg-card: #131722;
            --bg-card-hover: #1c2233;
            --accent-orange: #ff7700;
            --accent-orange-glow: rgba(255, 119, 0, 0.4);
            --accent-yellow: #ffb700;
            --text-light: #f0f4f8;
            --text-muted: #94a3b8;
            --border-color: #2a3447;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 13, 18, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-light);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-yellow));
            color: #000;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 0.9rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-orange);
            text-shadow: 0 0 8px var(--accent-orange-glow);
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;
            background: radial-gradient(circle at center, rgba(255, 119, 0, 0.15) 0%, rgba(11, 13, 18, 1) 70%);
            text-align: center;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero-subtitle {
            display: inline-block;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 1rem;
            border: 1px solid var(--accent-orange);
            padding: 4px 16px;
            border-radius: 20px;
            background: rgba(255, 119, 0, 0.05);
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 0%, #a0aec0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 32px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-orange), #d45d00);
            color: #ffffff;
            box-shadow: 0 4px 20px var(--accent-orange-glow);
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px var(--accent-orange-glow);
        }

        .btn-secondary {
